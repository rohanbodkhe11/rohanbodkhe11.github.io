<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin dashboard | Rohan Bodkhe</title><link rel="stylesheet" href="../css/portfolio.css"><style>main{padding:3rem 0}.bar,.section-head{display:flex;justify-content:space-between;align-items:center;gap:1rem}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin:2rem 0}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:7px;padding:1.2rem}.stat strong{display:block;font-size:2rem}.muted{color:var(--muted)}.nav{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}.nav button{border:1px solid var(--line);background:#fff;padding:.6rem;border-radius:4px;cursor:pointer}.nav button.active{background:var(--ink);color:#fff}.rows{display:grid;gap:.6rem}.row{border-top:1px solid var(--line);padding:.8rem 0;display:flex;justify-content:space-between;gap:1rem}.row button{padding:.4rem;border:1px solid var(--line);background:#fff;cursor:pointer}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-top:1rem}.field{display:grid;gap:.3rem}.field.full{grid-column:1/-1}.field label{font:.7rem 'DM Mono',monospace;color:var(--green);text-transform:uppercase}.field input,.field textarea{padding:.7rem;border:1px solid var(--line);border-radius:4px;font:inherit}.field textarea{min-height:100px}.actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.bar,.section-head{align-items:flex-start;flex-direction:column}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.row{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="bar"><div><p class="eyebrow">Supabase CMS</p><h1>Dashboard</h1></div><div class="actions"><a class="button" href="../index.html">View website</a><button class="button" id="logout">Logout</button></div></div><div id="status" class="muted">Checking session...</div><div id="app" class="hidden"><div id="stats" class="grid"></div><nav id="nav" class="nav"></nav><section class="panel"><div class="section-head"><div><p class="eyebrow">Manage records</p><h2 id="title">Projects</h2></div><button class="button primary" id="add">Add</button></div><div id="rows" class="rows"></div><form id="form" class="form hidden"></form></section></div></main><script src="../js/supabase-config.js"></script><script type="module">import {supabase,requireAdmin} from '../js/supabase-client.js'; const types={projects:['title','short_description','description','thumbnail_url','github_url','live_url','category','technologies','featured','published','display_order'],certifications:['title','organization','issue_date','credential_id','credential_url','certificate_url','description','featured','published','display_order'],gallery:['image_url','title','caption','category','date','featured','published','display_order'],achievements:['title','description','organization','date','image_url','url','featured','published','display_order'],experiences:['organization','position','location','start_date','end_date','currently_working','description','technologies','document_url','organization_url','published','display_order'],education:['institution','degree','branch','start_year','end_year','grade','description','logo_url','published','display_order'],skills:['name','category','level','published','display_order'],profiles:['name','headline','bio','profile_photo_url','location','email','phone','resume_url'],site_settings:['key','value']}; let active='projects', editing=null, rows=[]; const label=x=>x.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase()); async function boot(){const session=await requireAdmin(); if(!session)return; document.getElementById('status').remove(); document.getElementById('app').classList.remove('hidden'); renderNav(); await render();} function renderNav(){document.getElementById('nav').innerHTML=Object.keys(types).map(x=>`<button class="${x===active?'active':''}" data-type="${x}">${label(x)}</button>`).join('');document.querySelectorAll('[data-type]').forEach(b=>b.onclick=async()=>{active=b.dataset.type;editing=null;renderNav();render()})} async function render(){const {data,error}=await supabase.from(active).select('*').order('display_order',{ascending:true}); rows=data||[];document.getElementById('title').textContent=label(active);document.getElementById('rows').innerHTML=error?`<p>${error.message}</p>`:rows.map((r,i)=>`<div class="row"><span><strong>${escapeHtml(r.title||r.name||r.position||r.institution||r.key||'Record')}</strong><br><small class="muted">${r.published===false?'Draft':'Published'}</small></span><span class="actions"><button data-edit="${i}">Edit</button><button data-publish="${i}">${r.published===false?'Publish':'Hide'}</button><button data-delete="${i}">Delete</button></span></div>`).join('')||'<p class="muted">No records yet.</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(Number(b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(Number(b.dataset.delete)));document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=()=>publish(Number(b.dataset.publish)));document.getElementById('add').onclick=()=>edit(null);renderStats()} async function renderStats(){const names=['projects','certifications','gallery','achievements','experiences','contact_messages'];document.getElementById('stats').innerHTML=await Promise.all(names.map(async n=>{const {count}=await supabase.from(n).select('*',{count:'exact',head:true});return `<div class="stat"><strong>${count||0}</strong><span>${label(n)}</span></div>`})).then(x=>x.join(''))} function edit(index){editing=index;const item=index===null?{}:rows[index];document.getElementById('form').classList.remove('hidden');document.getElementById('form').innerHTML=types[active].map(f=>`<div class="field ${['description','bio','value'].includes(f)?'full':''}"><label>${label(f)}</label>${f==='description'||f==='bio'||f==='value'?`<textarea name="${f}">${escapeHtml(item[f]||'')}</textarea>`:`<input name="${f}" type="${f.includes('date')?'date':f.includes('year')||f==='level'||f==='display_order'?'number':f==='email'?'email':'text'}" value="${escapeHtml(item[f]||'')}">`}</div>`).join('')+`<div class="actions full"><button class="button primary">Save</button><button type="button" class="button" id="cancel">Cancel</button></div>`;document.getElementById('cancel').onclick=()=>document.getElementById('form').classList.add('hidden');document.getElementById('form').onsubmit=async e=>{e.preventDefault();const value=Object.fromEntries(new FormData(e.target));types[active].filter(f=>['featured','published','currently_working'].includes(f)).forEach(f=>value[f]=value[f]==='on');if(editing===null){value.id=crypto.randomUUID();await supabase.from(active).insert(value)}else await supabase.from(active).update(value).eq('id',rows[editing].id);document.getElementById('form').classList.add('hidden');render()}} async function publish(i){await supabase.from(active).update({published:rows[i].published===false}).eq('id',rows[i].id);render()} async function remove(i){if(confirm('Delete this record?')){await supabase.from(active).delete().eq('id',rows[i].id);render()}} function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();location.href='login/'};boot();</script></body></html>
