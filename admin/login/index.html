<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin login | Rohan Bodkhe</title><link rel="stylesheet" href="../../css/portfolio.css"><style>main{max-width:440px;padding-top:12vh}.panel{background:#fff;border:1px solid var(--line);border-radius:7px;padding:2rem}.field{display:grid;gap:.4rem;margin:1rem 0}.field label{font:.75rem 'DM Mono',monospace;color:var(--green);text-transform:uppercase}.field input{padding:.8rem;border:1px solid var(--line);border-radius:4px;font:inherit}.error{color:#b84935}</style></head><body><main class="wrap"><div class="panel"><p class="eyebrow">Secure CMS</p><h1>Admin login</h1><p>Sign in with the Supabase Auth account authorized for this portfolio.</p><form id="login"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div><button class="button primary" type="submit">Sign in</button><p id="message" class="error" role="alert"></p></form></div></main><script src="../../js/supabase-config.js"></script><script type="module">import {supabase} from '../../js/supabase-client.js'; const form=document.getElementById('login'); form.onsubmit=async e=>{e.preventDefault(); if(!supabase){document.getElementById('message').textContent='Configure js/supabase-config.js first.';return} const data=new FormData(form); const {error}=await supabase.auth.signInWithPassword({email:data.get('email'),password:data.get('password')}); if(error) document.getElementById('message').textContent=error.message; else location.href='../';};</script></body></html>
